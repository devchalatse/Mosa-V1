name: Mosa Backend CI

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 1 * * 0"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mosa
          POSTGRES_PASSWORD: mosa_password
          POSTGRES_DB: mosa_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U mosa -d mosa_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://mosa:mosa_password@localhost:5433/mosa_test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run dashboard update
        run: python scripts/update_dashboard_metrics.py

      - name: Cleanup sessions
        run: python scripts/cleanup_sessions.py

      - name: Weekly report
        if: github.event.schedule == '0 1 * * 0'
        run: python scripts/weekly_report.py