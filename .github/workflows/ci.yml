name: Mosa CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Start Mosa
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mosa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mosa_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mosa_test
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      - name: Verify requirements
        run: |
          echo "Requirements:"
          cat requirements.txt

      - name: Validate requirements
        run: |
          if grep -q "/opt/homebrew" requirements.txt; then
            echo "ERROR: requirements.txt contains a local Homebrew path."
            exit 1
          fi

          if grep -q "/Users/" requirements.txt; then
            echo "ERROR: requirements.txt contains a local macOS path."
            exit 1
          fi

          echo "requirements.txt is valid."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PostgreSQL
        run: |
          python -c "import psycopg2; print('PostgreSQL driver available')"

      - name: Verify database connection
        run: |
          python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(
              os.environ["DATABASE_URL"]
          )

          print("PostgreSQL connection successful")

          connection.close()
          PY

      - name: Verify application import
        run: |
          python -c "from app.main import app; print('Mosa application imported successfully')"

      - name: Start Mosa server
        run: |
          nohup uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > server.log 2>&1 &

          echo $! > server.pid

          echo "Waiting for Mosa to start..."
          sleep 10

      - name: Show server logs
        if: always()
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi

      - name: Check Mosa server
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:8000/ || exit 1

          echo "Mosa server is running successfully."

      - name: Stop Mosa server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi