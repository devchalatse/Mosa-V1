name: Mosa CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Start Mosa
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 3. Verify repository
      - name: Verify repository
        run: |
          echo "================================"
          echo "Python version"
          echo "================================"
          python --version

          echo "================================"
          echo "Working directory"
          echo "================================"
          pwd

          echo "================================"
          echo "Git commit"
          echo "================================"
          git rev-parse HEAD

          echo "================================"
          echo "Project files"
          echo "================================"
          ls -la

          echo "================================"
          echo "Requirements"
          echo "================================"
          nl -ba requirements.txt

      # 4. Make sure requirements don't contain local paths
      - name: Validate requirements
        run: |
          if grep -q "/opt/homebrew" requirements.txt; then
            echo "ERROR: requirements.txt contains a local Homebrew path."
            exit 1
          fi

          if grep -q "/Users/" requirements.txt; then
            echo "ERROR: requirements.txt contains a local macOS path."
            exit 1
          fi

          echo "requirements.txt looks valid."

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 6. Verify FastAPI application can be imported
      - name: Verify application
        env:
          PYTHONPATH: .
        run: |
          python -c "from app.main import app; print('Mosa application imported successfully')"

      # 7. Start FastAPI
      - name: Start Mosa server
        env:
          PYTHONPATH: .
        run: |
          nohup uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > server.log 2>&1 &

          echo $! > server.pid

          echo "Waiting for Mosa to start..."
          sleep 10

      # 8. Display server logs
      - name: Show server logs
        if: always()
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi

      # 9. Check server
      - name: Check Mosa server
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:8000/ || exit 1

          echo "Mosa server is running successfully."

      # 10. Stop server
      - name: Stop Mosa server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi